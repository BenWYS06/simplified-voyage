# Reusable job behind every backend workflow: finds out whether the PR touches the module, then builds and tests it.
# The workflow always runs, so each check can be required in branch protection; an unaffected PR skips the build,
# and GitHub counts a skipped job as passed. Pushes to main and manual runs always build.
# Stages and the full layout: docs/plans/2026-11-04-ci-pipeline.md.
name: Service CI (reusable)

on:
  workflow_call:
    inputs:
      modules:
        description: Maven modules from backend/, comma-separated (e.g. services/seat-service)
        required: true
        type: string
      paths:
        description: Extra path globs that affect the modules, one "- 'glob'" per line
        required: true
        type: string
      run-tests:
        description: false = compile main and test code only (modules whose tests are not ready)
        type: boolean
        default: true
      report-name:
        description: Name of the test report artifact uploaded when the build fails
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read   # paths-filter lists the PR's changed files through the API

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      affected: ${{ github.event_name != 'pull_request' || steps.filter.outputs.affected == 'true' }}
    steps:
      # common-lib and the parent poms affect every module
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            affected:
            - 'backend/common-lib/**'
            - 'backend/pom.xml'
            - 'backend/cloud/pom.xml'
            - 'backend/services/pom.xml'
            - '.github/workflows/_service-ci.yml'
            ${{ inputs.paths }}

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # -am also builds what the module depends on (common-lib), so a stale jar from the cache is never used.
      # Context and concurrency tests start MySQL or PostgreSQL with Testcontainers (Docker is on the runner).
      - name: Build and test
        if: inputs.run-tests
        run: mvn -B -ntp verify -pl ${{ inputs.modules }} -am

      - name: Compile only
        if: ${{ !inputs.run-tests }}
        run: mvn -B -ntp test-compile -pl ${{ inputs.modules }} -am

      # Surefire reports of a red run, so the failing test can be read without rerunning it
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report-name }}
          path: backend/**/target/surefire-reports/
          retention-days: 7
