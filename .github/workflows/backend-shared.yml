name: backend-shared

on:
  push:
    branches: [main]
    paths:
      - "backend/common-lib/**"
      - "backend/cloud/service-registry/**"
      - "backend/cloud/config-server/**"
      - "backend/services/location-service/**"
      - "backend/services/pricing-service/**"
      - "backend/services/ancillary-service/**"
      - "backend/pom.xml"
      - "backend/cloud/pom.xml"
      - "backend/services/pom.xml"
      - ".github/workflows/backend-shared.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/common-lib/**"
      - "backend/cloud/service-registry/**"
      - "backend/cloud/config-server/**"
      - "backend/services/location-service/**"
      - "backend/services/pricing-service/**"
      - "backend/services/ancillary-service/**"
      - "backend/pom.xml"
      - "backend/cloud/pom.xml"
      - "backend/services/pom.xml"
      - ".github/workflows/backend-shared.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

env:
  JAVA_VERSION: "17"
  IMAGE_MODULES: cloud/service-registry cloud/config-server services/location-service services/pricing-service services/ancillary-service
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: Test, build & image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Test & build
        run: mvn -B -ntp install -pl common-lib,cloud/service-registry,cloud/config-server -am

      # No unit tests planned for these three, so their tests are compiled but not run
      - name: Build location, pricing and ancillary
        run: mvn -B -ntp install -pl services/location-service,services/pricing-service,services/ancillary-service -am -DskipTests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-shared-test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

      # One image per module, named after its folder; main pushes them to GHCR as the commit SHA and latest
      - name: Push images
        if: env.PUBLISH == 'true'
        run: |
          for module in $IMAGE_MODULES; do
            mvn -B -ntp jib:build -pl "$module" \
              -Djib.to.image=ghcr.io/benwys06/$(basename "$module"):${{ github.sha }} \
              -Djib.to.tags=latest \
              -Djib.to.auth.username=${{ github.actor }} \
              -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
              -Djib.container.labels=org.opencontainers.image.source=https://github.com/${{ github.repository }}
          done

      # PR: build the images without pushing, so a broken image config fails the PR
      - name: Build images
        if: env.PUBLISH != 'true'
        run: |
          for module in $IMAGE_MODULES; do
            mvn -B -ntp jib:buildTar -pl "$module" -Djib.to.image=ghcr.io/benwys06/$(basename "$module"):pr
          done
