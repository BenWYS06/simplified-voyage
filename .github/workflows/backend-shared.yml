name: backend-shared

on:
  push:
    branches: [main]
    paths:
      - "backend/common-lib/**"
      - "backend/cloud/service-registry/**"
      - "backend/cloud/config-server/**"
      - "backend/services/location-service/**"
      - "backend/services/pricing-service/**"
      - "backend/services/ancillary-service/**"
      - "backend/pom.xml"
      - "backend/cloud/pom.xml"
      - "backend/services/pom.xml"
      - ".github/workflows/backend-shared.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/common-lib/**"
      - "backend/cloud/service-registry/**"
      - "backend/cloud/config-server/**"
      - "backend/services/location-service/**"
      - "backend/services/pricing-service/**"
      - "backend/services/ancillary-service/**"
      - "backend/pom.xml"
      - "backend/cloud/pom.xml"
      - "backend/services/pom.xml"
      - ".github/workflows/backend-shared.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

env:
  JAVA_VERSION: "17"

jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Test & build
        run: mvn -B -ntp verify -pl common-lib,cloud/service-registry,cloud/config-server -am

      # No unit tests planned for these three, so only their main and test code is compiled
      - name: Compile location, pricing and ancillary
        run: mvn -B -ntp test-compile -pl services/location-service,services/pricing-service,services/ancillary-service -am

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-shared-test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image (${{ matrix.name }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: service-registry, module: cloud/service-registry }
          - { name: config-server, module: cloud/config-server }
          - { name: location-service, module: services/location-service }
          - { name: pricing-service, module: services/pricing-service }
          - { name: ancillary-service, module: services/ancillary-service }
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/benwys06/${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Installs common-lib and the parent poms, so Jib can run on the module alone
      - name: Package
        run: mvn -B -ntp install -pl ${{ matrix.module }} -am -DskipTests

      # Jib builds the image from the pom (no Dockerfile). main: push to GHCR as latest + commit SHA
      - name: Build and push image
        if: env.PUBLISH == 'true'
        run: >
          mvn -B -ntp jib:build -pl ${{ matrix.module }}
          -Djib.to.image=${{ env.IMAGE }}:${{ github.sha }}
          -Djib.to.tags=latest
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
          -Djib.container.labels=org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # PR: build the image without pushing, so a broken image config fails the PR
      - name: Build image
        if: env.PUBLISH != 'true'
        run: mvn -B -ntp jib:buildTar -pl ${{ matrix.module }} -Djib.to.image=${{ env.IMAGE }}:pr
