# api-gateway: Keycloak JWT check, routing and the trusted user headers.
# Builds and tests the service on every PR (skipped when nothing it uses changed) and on every push to main.
name: api-gateway

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the run that is still going; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  api-gateway:
    uses: ./.github/workflows/_service-ci.yml
    with:
      modules: cloud/api-gateway
      report-name: api-gateway-test-reports
      paths: |
        - 'backend/cloud/api-gateway/**'
        - '.github/workflows/api-gateway.yml'
