name: notification-service

on:
  push:
    branches: [main]
    paths:
      - "backend/services/notification-service/**"
      - "backend/common-lib/**"
      - "backend/pom.xml"
      - "backend/services/pom.xml"
      - ".github/workflows/notification-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/services/notification-service/**"
      - "backend/common-lib/**"
      - "backend/pom.xml"
      - "backend/services/pom.xml"
      - ".github/workflows/notification-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

env:
  JAVA_VERSION: "17"
  MODULE: services/notification-service
  IMAGE: ghcr.io/benwys06/notification-service
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: Test, build & image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # -am also builds common-lib; install keeps it in the local repo so Jib can run on the service alone
      - name: Test & build
        run: mvn -B -ntp install -pl ${{ env.MODULE }} -am

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: notification-service-test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

      # Jib builds the image from the pom (no Dockerfile); main pushes it to GHCR as the commit SHA and latest
      - name: Push image
        if: env.PUBLISH == 'true'
        run: >
          mvn -B -ntp jib:build -pl ${{ env.MODULE }}
          -Djib.to.image=${{ env.IMAGE }}:${{ github.sha }}
          -Djib.to.tags=latest
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
          -Djib.container.labels=org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # PR: build the image without pushing, so a broken image config fails the PR
      - name: Build image
        if: env.PUBLISH != 'true'
        run: mvn -B -ntp jib:buildTar -pl ${{ env.MODULE }} -Djib.to.image=${{ env.IMAGE }}:pr
