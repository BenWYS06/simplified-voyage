# =============================================================================
# DEV INFRASTRUCTURE ONLY
# Starts MySQL + PostgreSQL (booking only) + Redis + Kafka with ports exposed to localhost.
# Use this when running services locally (not in Docker).
#
# Usage:
#   docker compose -f docker/docker-compose.dev.yml up -d
#   docker compose -f docker/docker-compose.dev.yml down        # keep data
#   docker compose -f docker/docker-compose.dev.yml down -v     # wipe data
# =============================================================================

services:

  # One MySQL holding every service database (matches the services' localhost:3306 defaults).
  # init-databases.sql runs only on first start (empty volume) and creates the databases;
  # each service's Flyway migrations then create its tables.
  mysql:
    image: mysql:8.0
    container_name: gds-mysql-dev
    ports:
      - "3306:3306"          # accessible at localhost:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # PostgreSQL for booking-service only (it needs a partial unique index for idempotent create).
  # POSTGRES_DB creates airline_booking_db on first start; booking's Flyway migrations create the tables.
  postgres:
    image: postgres:16-alpine
    container_name: gds-postgres-dev
    ports:
      - "5432:5432"          # accessible at localhost:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airline_booking_db
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: gds-redis-dev
    ports:
      - "6379:6379"          # accessible at localhost:6379
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.1.1
    container_name: gds-kafka-dev
    ports:
      - "9092:9092"          # accessible at localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092   # <-- localhost for local services
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

volumes:
  mysql-dev-data:
  postgres-dev-data:
